name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: music-visualizer-linux-amd64
            setup: |
              sudo apt-get update
              sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev libasound2-dev libpulse-dev
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: music-visualizer-darwin-arm64
            setup: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            artifact: music-visualizer-darwin-amd64
            setup: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: music-visualizer-windows-amd64.exe
            setup: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
